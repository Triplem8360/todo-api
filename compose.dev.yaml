name: todo-api

x-app-environment: &app-environment
  ALLOWED_HOSTS: '["localhost","127.0.0.1","api","testserver"]'
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-todo_user}:${POSTGRES_PASSWORD:-123}@db:5432/${POSTGRES_DB:-todo_db}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/2
  CELERY_RESULT_BACKEND: redis://redis:6379/3
  MAIL_SERVER: smtp4dev
  MAIL_PORT: 25
  MAIL_STARTTLS: "false"
  MAIL_SSL_TLS: "false"
  USE_CREDENTIALS: "false"
  SUPPRESS_SEND: "false"

x-app: &app
  image: triplem/todo-api:dev

  build:
    context: .
    dockerfile: Dockerfile.dev
    args:
      DEV_UID: ${HOST_UID:-1000}
      DEV_GID: ${HOST_GID:-1000}

  env_file:
    - .env

  environment: *app-environment


x-runtime-volumes: &runtime-volumes
  - ./src:/app/src
  - ./alembic:/app/alembic
  - ./alembic.ini:/app/alembic.ini


services:
  db:
    image: postgres:16-bookworm

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
      POSTGRES_USER: ${POSTGRES_USER:-todo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  redis:
    image: redis:7.4.10-alpine3.21

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-256mb}
      - --maxmemory-policy
      - noeviction

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  smtp4dev:
    image: rnwood/smtp4dev:v3

    ports:
      - "127.0.0.1:${SMTP4DEV_WEB_PORT:-5000}:80"
      - "127.0.0.1:${SMTP4DEV_SMTP_PORT:-2525}:25"

    environment:
      ServerOptions__HostName: smtp4dev
      ServerOptions__LockSettings: "true"
      ServerOptions__TlsMode: None

    volumes:
      - smtp4dev_data:/smtp4dev

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost/
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s


  migrate:
    <<: *app

    volumes: *runtime-volumes

    command:
      - alembic
      - upgrade
      - head

    depends_on:
      db:
        condition: service_healthy

    restart: "no"


  api:
    <<: *app

    environment:
      <<: *app-environment
      APP_DEBUG: "true"

    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    ports:
      - "${API_PORT:-8000}:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      smtp4dev:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    init: true


  celery-worker:
    <<: *app

    volumes: *runtime-volumes

    command:
      - celery
      - --app
      - todo_api.background.celery_app:celery_app
      - worker
      - --loglevel
      - ${CELERY_LOG_LEVEL:-INFO}
      - --concurrency
      - ${CELERY_WORKER_CONCURRENCY:-2}

    depends_on:
      redis:
        condition: service_healthy
      smtp4dev:
        condition: service_healthy

    init: true


  loadtest-seed:
    <<: *app

    profiles:
      - loadtest

    environment:
      <<: *app-environment
      TODO_API_SEED_PASSWORD: ${LOCUST_TEST_PASSWORD:-LocustPass123!}

    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts

    command:
      - python
      - scripts/seed_database.py
      - --seed
      - ${LOCUST_TEST_SEED:-9001}
      - --users
      - ${LOCUST_TEST_USER_COUNT:-50}
      - --inactive-rate
      - "0"
      - --todos-per-user
      - ${LOCUST_SEED_TODOS_PER_USER:-20}
      - --api-keys-per-user
      - "0"
      - --refresh-sessions-per-user
      - "0"
      - --oauth-codes-per-user
      - "0"

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: "no"


  locust:
    image: locustio/locust:2.46.2

    profiles:
      - loadtest

    environment:
      LOCUST_LOCUSTFILE: /mnt/locust/locustfile.py
      LOCUST_HOST: http://api:8000
      LOCUST_WEB_HOST: 0.0.0.0
      LOCUST_USERS: ${LOCUST_USERS:-5}
      LOCUST_SPAWN_RATE: ${LOCUST_SPAWN_RATE:-1}
      LOCUST_AUTOSTART: "${LOCUST_AUTOSTART:-false}"
      LOCUST_RUN_TIME: ${LOCUST_RUN_TIME:-25s}
      LOCUST_TEST_SEED: ${LOCUST_TEST_SEED:-9001}
      LOCUST_TEST_USER_COUNT: ${LOCUST_TEST_USER_COUNT:-50}
      LOCUST_TEST_PASSWORD: ${LOCUST_TEST_PASSWORD:-LocustPass123!}
      LOCUST_MIN_WAIT_SECONDS: ${LOCUST_MIN_WAIT_SECONDS:-0.5}
      LOCUST_MAX_WAIT_SECONDS: ${LOCUST_MAX_WAIT_SECONDS:-2.0}
      LOCUST_MAX_TRACKED_TODOS: ${LOCUST_MAX_TRACKED_TODOS:-50}
      LOCUST_FAILURE_RATIO_LIMIT: ${LOCUST_FAILURE_RATIO_LIMIT:-0.01}
      LOCUST_P95_MS_LIMIT: ${LOCUST_P95_MS_LIMIT:-750}

    ports:
      - "127.0.0.1:${LOCUST_WEB_PORT:-8089}:8089"

    volumes:
      - ./loadtests:/mnt/locust:ro
      - ./loadtests/results:/mnt/locust/results

    command:
      - --locustfile
      - /mnt/locust/locustfile.py
      - --host
      - http://api:8000
      - --web-host
      - 0.0.0.0

    depends_on:
      api:
        condition: service_healthy
      loadtest-seed:
        condition: service_completed_successfully

    init: true


volumes:
  postgres_data:
  redis_data:
  smtp4dev_data:
