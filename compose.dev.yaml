name: todo-api

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-todo_user}:${POSTGRES_PASSWORD:-123}@db:5432/${POSTGRES_DB:-todo_db}
  REDIS_URL: redis://redis:6379/0
  MAIL_SERVER: smtp4dev
  MAIL_PORT: 25
  MAIL_STARTTLS: "false"
  MAIL_SSL_TLS: "false"
  USE_CREDENTIALS: "false"
  SUPPRESS_SEND: "false"

x-app: &app
  image: triplem/todo-api:dev

  build:
    context: .
    dockerfile: Dockerfile.dev
    args:
      DEV_UID: ${HOST_UID:-1000}
      DEV_GID: ${HOST_GID:-1000}

  env_file:
    - .env

  environment: *app-environment


x-runtime-volumes: &runtime-volumes
  - ./src:/app/src
  - ./alembic:/app/alembic
  - ./alembic.ini:/app/alembic.ini


services:
  db:
    image: postgres:16-bookworm

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
      POSTGRES_USER: ${POSTGRES_USER:-todo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  redis:
    image: redis:7.4.10-alpine3.21

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  smtp4dev:
    image: rnwood/smtp4dev:v3

    ports:
      - "127.0.0.1:${SMTP4DEV_WEB_PORT:-5000}:80"
      - "127.0.0.1:${SMTP4DEV_SMTP_PORT:-2525}:25"

    environment:
      ServerOptions__HostName: smtp4dev
      ServerOptions__LockSettings: "true"
      ServerOptions__TlsMode: None

    volumes:
      - smtp4dev_data:/smtp4dev

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost/
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s


  migrate:
    <<: *app

    volumes: *runtime-volumes

    command:
      - alembic
      - upgrade
      - head

    depends_on:
      db:
        condition: service_healthy

    restart: "no"


  api:
    <<: *app

    environment:
      <<: *app-environment
      APP_DEBUG: "true"

    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    ports:
      - "${API_PORT:-8000}:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      smtp4dev:
        condition: service_healthy

    init: true


volumes:
  postgres_data:
  smtp4dev_data:
