[project]
name = "todo-api"
version = "0.1.0"
description = "An async FastAPI authentication service with rotating JWTs and API keys."
readme = "README.md"
authors = [
    { name = "TripleM", email = "mazaherimohamad4@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.1",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.124.4",
    "fastapi-cache2>=0.2.2,<0.3",
    "jinja2>=3.1.6,<4",
    "prometheus-client>=0.25.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.33.0",
]

[project.scripts]
todo-api = "todo_api.main:run"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=24.8.0",
    "faker>=40.36.0",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
