name: Staging Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: staging-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push staging image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
    container:
      image: hamravesh/darkube-cli:v1.1
      options: --user root
    env:
      IMAGE_NAME: ${{ vars.DARKUBE_IMAGE_NAME }}
      DOCKER_AUTH_CONFIG: ${{ secrets.DOCKER_AUTH_CONFIG }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check build configuration
        run: |
          test -n "$IMAGE_NAME"
          test -n "$DOCKER_AUTH_CONFIG"

      - name: Build and push staging image
        run: >-
          darkube build --push
          -t "$IMAGE_NAME:${GITHUB_SHA:0:7}"
          -t "$IMAGE_NAME:main"
          --docker-auth-config "$DOCKER_AUTH_CONFIG"
          --workdir .
          --file ./Dockerfile.dev
          --build-context .

  deploy:
    name: Deploy staging image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    container:
      image: hamravesh/darkube-cli:v1.1
      options: --user root
    env:
      APP_ID: ${{ secrets.DARKUBE_APP_ID }}
      DEPLOY_TOKEN: ${{ secrets.DARKUBE_DEPLOY_TOKEN }}

    steps:
      - name: Check deployment configuration
        run: |
          test -n "$APP_ID"
          test -n "$DEPLOY_TOKEN"

      - name: Deploy staging image
        run: >-
          darkube deploy
          --token "$DEPLOY_TOKEN"
          --app-id "$APP_ID"
          --image-tag "${GITHUB_SHA:0:7}"
          --job-id "$GITHUB_RUN_ID"
