jobs:
  darkube_build_api_triplem-test_hamravesh-c11:
    container:
      image: hamravesh/darkube-cli:v1.1
      options: --user root
    env:
      IMAGE_NAME: registry.hamdocker.ir/triplem/api
    runs-on: ubuntu-latest
    steps:
    - name: checkout commit
      uses: actions/checkout@v4
    - name: darkube-cli build & push
      run: 'darkube build --push -t $IMAGE_NAME:${GITHUB_SHA:0:7} -t $IMAGE_NAME:${GITHUB_REF_NAME}
        --docker-auth-config ${{secrets.DOCKER_AUTH_CONFIG}} --workdir . --file ./Dockerfile.dev
        --build-context . '
  darkube_deploy_api_triplem-test_hamravesh-c11:
    container: hamravesh/darkube-cli:v1.1
    needs: darkube_build_api_triplem-test_hamravesh-c11
    runs-on: ubuntu-latest
    steps:
    - name: darkube-cli deploy
      run: darkube deploy --token ${{secrets.DEPLOY_TOKEN_API_TRIPLEM_TEST_HAMRAVESH_C11}}
        --app-id ${{secrets.APP_ID_API_TRIPLEM_TEST_HAMRAVESH_C11}} --image-tag ${GITHUB_SHA:0:7}
        --job-id ${GITHUB_RUN_ID}
'on':
  push:
    branches:
    - main
