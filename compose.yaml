name: todo-api

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-todo_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-todo_db}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/2
  CELERY_RESULT_BACKEND: redis://redis:6379/3
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}

x-app: &app
  image: triplem/todo-api:${IMAGE_TAG:-latest}

  build:
    context: .
    dockerfile: Dockerfile

  env_file:
    - .env

  environment: *app-environment


services:
  db:
    image: postgres:17.10-alpine3.24

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
      POSTGRES_USER: ${POSTGRES_USER:-todo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  redis:
    image: redis:7.4.10-alpine3.21

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-256mb}
      - --maxmemory-policy
      - noeviction

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped


  migrate:
    <<: *app

    command:
      - alembic
      - upgrade
      - head

    depends_on:
      db:
        condition: service_healthy

    restart: "no"


  api:
    <<: *app

    ports:
      - "${API_PORT:-8000}:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    restart: unless-stopped
    init: true


  celery-worker:
    <<: *app

    command:
      - celery
      - --app
      - todo_api.background.celery_app:celery_app
      - worker
      - --loglevel
      - ${CELERY_LOG_LEVEL:-INFO}
      - --concurrency
      - ${CELERY_WORKER_CONCURRENCY:-2}
      - --queues
      - default,emails

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    healthcheck:
      disable: true

    restart: unless-stopped
    init: true


  celery-maintenance-worker:
    <<: *app

    command:
      - celery
      - --app
      - todo_api.background.celery_app:celery_app
      - worker
      - --loglevel
      - ${CELERY_LOG_LEVEL:-INFO}
      - --concurrency
      - ${CELERY_MAINTENANCE_WORKER_CONCURRENCY:-1}
      - --queues
      - maintenance

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    healthcheck:
      disable: true

    restart: unless-stopped
    init: true


  celery-beat:
    <<: *app

    command:
      - celery
      - --app
      - todo_api.background.celery_app:celery_app
      - beat
      - --loglevel
      - ${CELERY_LOG_LEVEL:-INFO}
      - --schedule
      - /tmp/celerybeat-schedule

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    healthcheck:
      disable: true

    restart: unless-stopped
    init: true


volumes:
  postgres_data:
  redis_data:
